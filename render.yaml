services:
  - type: web
    name: mini-erp-financiero-demo
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: demo
      - key: ACCOUNTING_AUTO_GENERATE
        value: "false"
      - key: ACCOUNTING_AUTO_POST
        value: "false"
      - key: PRODUCTION_ACCOUNTING_RULES
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ATTACHMENT_ENCRYPTION_ACTIVE_VERSION
        value: V1
      - key: ATTACHMENT_ENCRYPTION_KEY_V1
        sync: false
      - key: ATTACHMENT_ENCRYPTION_KEY
        sync: false
